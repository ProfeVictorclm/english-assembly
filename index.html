<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Assembly</title>

<style>
/* =====================================================================
   1. VARIABLES GENERALES  (colores, fondo, tamaños)
   ===================================================================== */
:root {
  /* >>> FONDO: para usar una imagen de Genially como fondo, cambia esta línea por:
         --page-bg-image: url("images/fondo.png");
     (sube la imagen al mismo repositorio, dentro de una carpeta "images") */
  --page-bg-image: none;

  --page-bg-color: #fff8e7;
  --ink: #2b2d42;
  --white: #ffffff;
  --radius: 32px;
  --shadow: 0 8px 0 rgba(43, 45, 66, 0.12);
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background-color: var(--page-bg-color);
  background-image:
    var(--page-bg-image),
    radial-gradient(circle at 10% 15%, #ffe9a8 0 90px, transparent 91px),
    radial-gradient(circle at 92% 20%, #bfeaff 0 120px, transparent 121px),
    radial-gradient(circle at 85% 88%, #ffd3e6 0 110px, transparent 111px),
    radial-gradient(circle at 8% 90%, #c9f5d0 0 100px, transparent 101px);
  background-size: cover, auto, auto, auto, auto;
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}

/* =====================================================================
   2. ESTRUCTURA
   ===================================================================== */
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 20px 40px;
}

/* Barra de progreso */
.top { margin-bottom: 18px; }
.progress-label {
  text-align: center;
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.progress-track {
  height: 22px;
  background: rgba(255, 255, 255, 0.9);
  border: 4px solid var(--white);
  border-radius: 999px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ff9f1c, #ff5d8f, #7b61ff);
  border-radius: 999px;
  transition: width 0.5s ease;
}

h1.title {
  text-align: center;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  margin: 18px 0 26px;
  line-height: 1.15;
}

/* =====================================================================
   3. COLORES DE LAS TARJETAS (clases reutilizables)
   ===================================================================== */
.c-red    { --tint: #ffe0e0; --accent: #ef476f; }
.c-orange { --tint: #ffe9d1; --accent: #ff8c1a; }
.c-yellow { --tint: #fff4bf; --accent: #f2b705; }
.c-green  { --tint: #d9f7de; --accent: #2bb673; }
.c-teal   { --tint: #d3f5f2; --accent: #14a3a0; }
.c-blue   { --tint: #dcecff; --accent: #3a86ff; }
.c-purple { --tint: #ebe0ff; --accent: #7b61ff; }
.c-pink   { --tint: #ffdcec; --accent: #ec4899; }

/* =====================================================================
   4. REJILLA Y TARJETAS DE OPCIONES
   ===================================================================== */
.grid {
  display: grid;
  gap: 22px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 190px;
  padding: 18px 12px;
  font-family: inherit;
  color: var(--ink);
  background: var(--tint);
  border: 8px solid var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-4px) scale(1.02); }
.card:active { transform: scale(0.97); }
.card:focus-visible { outline: 6px solid var(--ink); outline-offset: 4px; }

.card .label {
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
}

/* Marca de selección (✓) */
.card .check {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 52px;
  height: 52px;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: 900;
  color: var(--white);
  background: var(--accent);
  border: 5px solid var(--white);
  border-radius: 50%;
  box-shadow: var(--shadow);
}

/* Estado SELECCIONADO */
.card.selected {
  border-color: var(--accent);
  background: var(--white);
  box-shadow: 0 0 0 8px var(--tint), 0 10px 0 rgba(43, 45, 66, 0.18);
  transform: scale(1.05);
}
.card.selected .check { display: flex; }
.card.selected .label { color: var(--accent); }
.card.pop { animation: pop 0.45s ease; }

@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.14) rotate(-2deg); }
  100% { transform: scale(1.05); }
}

/* =====================================================================
   5. ICONOS  —  AQUÍ SE SUSTITUYEN LOS EMOJIS POR IMÁGENES DE GENIALLY
   ---------------------------------------------------------------------
   Cada tarjeta usa un contenedor ".icon".
   - Si la opción NO tiene imagen, se muestra el emoji (".icon-emoji").
   - Si la opción SÍ tiene imagen, se muestra ".icon-img".
   Para cambiar el tamaño de todas las imágenes a la vez, edita ".icon" y ".icon-img".
   ===================================================================== */
.icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 110px;
  height: 110px;
}
.icon-emoji { font-size: 5.2rem; line-height: 1; }
.icon-img   { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Pantalla de los días: insignia redonda con las 3 primeras letras
   (si pones imágenes en los días, esta insignia desaparece sola) */
.grid-days .icon-emoji {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100px;
  height: 100px;
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--white);
  background: var(--accent);
  border-radius: 50%;
}

/* =====================================================================
   6. BOTONES DE NAVEGACIÓN
   ===================================================================== */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: 34px;
}

.btn {
  font-family: inherit;
  font-size: 2.2rem;
  font-weight: 800;
  padding: 18px 40px;
  min-height: 84px;
  color: var(--white);
  background: #3a86ff;
  border: 6px solid var(--white);
  border-radius: 999px;
  box-shadow: var(--shadow);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s ease;
}
.btn:hover { transform: translateY(-3px) scale(1.03); }
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: 6px solid var(--ink); outline-offset: 4px; }

.btn-next  { background: #2bb673; animation: nudge 1.4s ease-in-out infinite; }
.btn-back  { background: #9aa0b4; font-size: 1.7rem; padding: 14px 28px; min-height: 68px; }
.btn-again { background: #ff5d8f; }
.hidden    { visibility: hidden; pointer-events: none; }

@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(6px); }
}

/* =====================================================================
   7. PANTALLA FINAL
   ===================================================================== */
.say-list {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.say-card {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 18px 28px;
  background: var(--tint);
  border: 8px solid var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: slideIn 0.5s ease both;
}
.say-card:nth-child(2) { animation-delay: 0.12s; }
.say-card:nth-child(3) { animation-delay: 0.24s; }
.say-card:nth-child(4) { animation-delay: 0.36s; }

.say-card .icon { width: 100px; height: 100px; flex: none; }
.say-card .icon-emoji { font-size: 4.8rem; }
.say-card .sentence {
  font-size: clamp(1.9rem, 5vw, 3rem);
  font-weight: 800;
  line-height: 1.2;
}
.say-card .sentence .word {
  color: var(--accent);
  background: var(--white);
  padding: 0 14px;
  border-radius: 18px;
  white-space: nowrap;
}
/* En la pantalla final los días no necesitan insignia redonda grande */
.say-card .icon-emoji.badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 92px;
  height: 92px;
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--white);
  background: var(--accent);
  border-radius: 50%;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.final-nav { justify-content: center; flex-wrap: wrap; }

/* =====================================================================
   8. PANTALLAS PEQUEÑAS Y ACCESIBILIDAD
   ===================================================================== */
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { min-height: 150px; }
  .card .label { font-size: 1.5rem; }
  .icon { width: 80px; height: 80px; }
  .icon-emoji { font-size: 3.8rem; }
  .grid-days .icon-emoji { width: 76px; height: 76px; font-size: 2rem; }
  .say-card { flex-direction: column; text-align: center; gap: 10px; }
  .btn { font-size: 1.7rem; padding: 14px 26px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>
  <main id="screen"></main>
</div>

<script>
/* =====================================================================
   A. CONTENIDO DE LA ASAMBLEA  (aquí se cambian textos e imágenes)
   ---------------------------------------------------------------------
   CÓMO SUSTITUIR EMOJIS POR IMÁGENES DE GENIALLY:
   1. Exporta cada imagen desde Genially (PNG con fondo transparente).
   2. Súbelas al repositorio, por ejemplo a una carpeta "images".
   3. En cada opción, rellena el campo  img  con la ruta, por ejemplo:
          img: "images/happy.png"
      Si "img" está vacío (""), se muestra el emoji provisional.
   ===================================================================== */
var STEPS = [
  {
    key: "feeling",
    id: "feelings",
    title: "How do you feel today?",
    options: [
      { value: "Happy",   icon: "😊", img: "", color: "c-yellow" },  // img: "images/happy.png"
      { value: "Sad",     icon: "😢", img: "", color: "c-blue"   },  // img: "images/sad.png"
      { value: "Angry",   icon: "😠", img: "", color: "c-red"    },  // img: "images/angry.png"
      { value: "Tired",   icon: "😴", img: "", color: "c-purple" },  // img: "images/tired.png"
      { value: "Excited", icon: "🤩", img: "", color: "c-orange" },  // img: "images/excited.png"
      { value: "Okay",    icon: "🙂", img: "", color: "c-green"  }   // img: "images/okay.png"
    ]
  },
  {
    key: "day",
    id: "days",
    title: "What day is it?",
    /* En los días, "icon" es la abreviatura que se ve en la insignia redonda.
       Si añades "img", se verá la imagen en lugar de la insignia. */
    options: [
      { value: "Monday",    icon: "Mon", img: "", color: "c-red"    },  // img: "images/monday.png"
      { value: "Tuesday",   icon: "Tue", img: "", color: "c-orange" },  // img: "images/tuesday.png"
      { value: "Wednesday", icon: "Wed", img: "", color: "c-yellow" },  // img: "images/wednesday.png"
      { value: "Thursday",  icon: "Thu", img: "", color: "c-green"  },  // img: "images/thursday.png"
      { value: "Friday",    icon: "Fri", img: "", color: "c-teal"   },  // img: "images/friday.png"
      { value: "Saturday",  icon: "Sat", img: "", color: "c-blue"   },  // img: "images/saturday.png"
      { value: "Sunday",    icon: "Sun", img: "", color: "c-purple" }   // img: "images/sunday.png"
    ]
  },
  {
    key: "weather",
    id: "weather",
    title: "What's the weather like?",
    options: [
      { value: "Sunny",  icon: "☀️", img: "", color: "c-yellow" },  // img: "images/sunny.png"
      { value: "Cloudy", icon: "☁️", img: "", color: "c-blue"   },  // img: "images/cloudy.png"
      { value: "Rainy",  icon: "🌧️", img: "", color: "c-teal"   },  // img: "images/rainy.png"
      { value: "Stormy", icon: "⛈️", img: "", color: "c-purple" },  // img: "images/stormy.png"
      { value: "Snowy",  icon: "❄️", img: "", color: "c-pink"   }   // img: "images/snowy.png"
    ]
  },
  {
    key: "transport",
    id: "transport",
    title: "How did you come to school?",
    options: [
      { value: "Walking", icon: "🚶", img: "", color: "c-green"  },  // img: "images/walking.png"
      { value: "Bike",    icon: "🚲", img: "", color: "c-orange" },  // img: "images/bike.png"
      { value: "Bus",     icon: "🚌", img: "", color: "c-yellow" },  // img: "images/bus.png"
      { value: "Car",     icon: "🚗", img: "", color: "c-red"    }   // img: "images/car.png"
    ]
  }
];

/* =====================================================================
   B. FRASES DE LA PANTALLA FINAL
   Devuelven [texto antes, palabra destacada, texto después].
   ===================================================================== */
function buildSentence(key, value) {
  if (key === "feeling") return ["I feel ", value, "."];
  if (key === "day")     return ["Today is ", value, "."];
  if (key === "weather") return ["The weather is ", value, "."];
  if (key === "transport") {
    if (value === "Walking") return ["I came to school ", "walking", "."];
    return ["I came to school by ", value.toLowerCase(), "."];
  }
  return ["", value, ""];
}

/* =====================================================================
   C. MEMORIA (localStorage con copia de seguridad en memoria)
   ===================================================================== */
var STORAGE_KEY = "englishAssemblyYear1_v1";
var memoryCopy = null;   // por si el navegador bloquea localStorage

var state = { answers: {}, step: 0 };   // step: 0..3 preguntas, 4 = pantalla final
var FINAL_STEP = STEPS.length;

function loadSaved() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignorar */ }
  return memoryCopy;
}

function saveState() {
  var data = { answers: state.answers, step: state.step };
  memoryCopy = JSON.parse(JSON.stringify(data));
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignorar */ }
}

function clearSaved() {
  memoryCopy = null;
  try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignorar */ }
}

function firstUnanswered() {
  for (var i = 0; i < STEPS.length; i++) {
    if (!state.answers[STEPS[i].key]) return i;
  }
  return FINAL_STEP;
}

/* =====================================================================
   D. UTILIDADES DE DIBUJO
   ===================================================================== */
function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* Crea el icono de una opción: imagen si existe "img", si no el emoji. */
function makeIcon(option, extraClass) {
  var wrap = el("span", "icon");
  wrap.setAttribute("aria-hidden", "true");
  if (option.img) {
    var img = document.createElement("img");
    img.className = "icon-img";
    img.src = option.img;
    img.alt = "";
    wrap.appendChild(img);
  } else {
    wrap.appendChild(el("span", "icon-emoji" + (extraClass ? " " + extraClass : ""), option.icon));
  }
  return wrap;
}

function findOption(step, value) {
  for (var i = 0; i < step.options.length; i++) {
    if (step.options[i].value === value) return step.options[i];
  }
  return null;
}

function setProgress() {
  var label = document.getElementById("progressLabel");
  var fill = document.getElementById("progressFill");
  if (state.step >= FINAL_STEP) {
    label.textContent = "🎉 Finished!";
    fill.style.width = "100%";
  } else {
    label.textContent = (state.step + 1) + " / " + STEPS.length;
    fill.style.width = (((state.step + 1) / STEPS.length) * 100) + "%";
  }
}

/* =====================================================================
   E. PANTALLAS
   ===================================================================== */
function goTo(step) {
  state.step = step;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  var step = STEPS[state.step];
  var screen = document.getElementById("screen");
  var section = el("section", "step step-" + step.id);

  section.appendChild(el("h1", "title", step.title));

  var grid = el("div", "grid grid-" + step.id);
  var nextBtn = el("button", "btn btn-next", "Next →");
  nextBtn.type = "button";

  var hasAnswer = !!state.answers[step.key];
  if (!hasAnswer) { nextBtn.classList.add("hidden"); nextBtn.disabled = true; }

  step.options.forEach(function (opt) {
    var card = el("button", "card " + opt.color);
    card.type = "button";
    var selected = state.answers[step.key] === opt.value;
    if (selected) card.classList.add("selected");
    card.setAttribute("aria-pressed", selected ? "true" : "false");

    card.appendChild(makeIcon(opt));
    card.appendChild(el("span", "label", opt.value));
    var check = el("span", "check", "✓");
    check.setAttribute("aria-hidden", "true");
    card.appendChild(check);

    card.addEventListener("click", function () {
      state.answers[step.key] = opt.value;
      saveState();

      var all = grid.querySelectorAll(".card");
      for (var i = 0; i < all.length; i++) {
        var on = all[i] === card;
        all[i].classList.toggle("selected", on);
        all[i].setAttribute("aria-pressed", on ? "true" : "false");
      }
      card.classList.remove("pop");
      void card.offsetWidth;          // reinicia la animación
      card.classList.add("pop");

      nextBtn.classList.remove("hidden");
      nextBtn.disabled = false;
    });

    grid.appendChild(card);
  });
  section.appendChild(grid);

  var nav = el("div", "nav");
  var backBtn = el("button", "btn btn-back", "← Back");
  backBtn.type = "button";
  if (state.step === 0) backBtn.classList.add("hidden");
  backBtn.addEventListener("click", function () { goTo(state.step - 1); });

  nextBtn.addEventListener("click", function () {
    if (!state.answers[step.key]) return;       // no se avanza sin elegir
    goTo(state.step + 1);
  });

  nav.appendChild(backBtn);
  nav.appendChild(nextBtn);
  section.appendChild(nav);

  screen.innerHTML = "";
  screen.appendChild(section);
}

function renderFinal() {
  var screen = document.getElementById("screen");
  var section = el("section", "step step-final");

  section.appendChild(el("h1", "title", "Let's say it all! 🗣️"));

  var list = el("div", "say-list");
  STEPS.forEach(function (step) {
    var value = state.answers[step.key];
    var opt = findOption(step, value);
    var parts = buildSentence(step.key, value);

    var card = el("div", "say-card " + (opt ? opt.color : "c-blue"));
    if (opt) card.appendChild(makeIcon(opt, step.key === "day" ? "badge" : ""));

    var sentence = el("div", "sentence");
    sentence.appendChild(document.createTextNode(parts[0]));
    sentence.appendChild(el("span", "word", parts[1]));
    sentence.appendChild(document.createTextNode(parts[2]));
    card.appendChild(sentence);

    list.appendChild(card);
  });
  section.appendChild(list);

  var nav = el("div", "nav final-nav");
  var backBtn = el("button", "btn btn-back", "← Back");
  backBtn.type = "button";
  backBtn.addEventListener("click", function () { goTo(STEPS.length - 1); });

  var againBtn = el("button", "btn btn-again", "🔄 Start again");
  againBtn.type = "button";
  againBtn.addEventListener("click", function () {
    clearSaved();
    state = { answers: {}, step: 0 };
    render();
    window.scrollTo(0, 0);
  });

  nav.appendChild(backBtn);
  nav.appendChild(againBtn);
  section.appendChild(nav);

  screen.innerHTML = "";
  screen.appendChild(section);
}

function render() {
  setProgress();
  if (state.step >= FINAL_STEP) renderFinal();
  else renderQuestion();
}

/* =====================================================================
   F. ARRANQUE
   ===================================================================== */
function init() {
  var saved = loadSaved();
  state = { answers: {}, step: 0 };

  if (saved && saved.answers && typeof saved.answers === "object") {
    STEPS.forEach(function (step) {
      var v = saved.answers[step.key];
      if (findOption(step, v)) state.answers[step.key] = v;   // solo valores válidos
    });
  }

  var step = (saved && typeof saved.step === "number") ? Math.floor(saved.step) : 0;
  if (!(step >= 0)) step = 0;
  if (step > FINAL_STEP) step = FINAL_STEP;
  var limit = firstUnanswered();           // no se puede saltar una pregunta sin responder
  if (step > limit) step = limit;

  state.step = step;
  render();
}

init();
</script>
</body>
</html>
