<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Assembly</title>

<style>
/* =====================================================================
   1. VARIABLES GENERALES  (colores, fondo, tamaños)
   ===================================================================== */
:root {
  /* >>> FONDO: para usar una imagen de Genially como fondo, cambia esta línea por:
         --page-bg-image: url("images/fondo.png");
     (sube la imagen al mismo repositorio, dentro de una carpeta "images") */
  --page-bg-image: none;

  --page-bg-color: #fff8e7;
  --ink: #2b2d42;
  --white: #ffffff;
  --radius: 32px;
  --shadow: 0 8px 0 rgba(43, 45, 66, 0.12);
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background-color: var(--page-bg-color);
  background-image:
    var(--page-bg-image),
    radial-gradient(circle at 10% 15%, #ffe9a8 0 90px, transparent 91px),
    radial-gradient(circle at 92% 20%, #bfeaff 0 120px, transparent 121px),
    radial-gradient(circle at 85% 88%, #ffd3e6 0 110px, transparent 111px),
    radial-gradient(circle at 8% 90%, #c9f5d0 0 100px, transparent 101px);
  background-size: cover, auto, auto, auto, auto;
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}

/* =====================================================================
   2. ESTRUCTURA
   ===================================================================== */
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 20px 40px;
}

/* Barra de progreso */
.top { margin-bottom: 18px; }
.progress-label {
  text-align: center;
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.progress-track {
  height: 22px;
  background: rgba(255, 255, 255, 0.9);
  border: 4px solid var(--white);
  border-radius: 999px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ff9f1c, #ff5d8f, #7b61ff);
  border-radius: 999px;
  transition: width 0.5s ease;
}

h1.title {
  text-align: center;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  margin: 18px 0 26px;
  line-height: 1.15;
}

/* =====================================================================
   3. COLORES DE LAS TARJETAS (clases reutilizables)
   ===================================================================== */
.c-red    { --tint: #ffe0e0; --accent: #ef476f; }
.c-orange { --tint: #ffe9d1; --accent: #ff8c1a; }
.c-yellow { --tint: #fff4bf; --accent: #f2b705; }
.c-green  { --tint: #d9f7de; --accent: #2bb673; }
.c-teal   { --tint: #d3f5f2; --accent: #14a3a0; }
.c-blue   { --tint: #dcecff; --accent: #3a86ff; }
.c-purple { --tint: #ebe0ff; --accent: #7b61ff; }
.c-pink   { --tint: #ffdcec; --accent: #ec4899; }

/* =====================================================================
   4. REJILLA Y TARJETAS DE OPCIONES
   ===================================================================== */
.grid {
  display: grid;
  gap: 22px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 190px;
  padding: 18px 12px;
  font-family: inherit;
  color: var(--ink);
  background: var(--tint);
  border: 8px solid var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-4px) scale(1.02); }
.card:active { transform: scale(0.97); }
.card:focus-visible { outline: 6px solid var(--ink); outline-offset: 4px; }

.card .label {
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
}

/* Marca de selección (✓) */
.card .check {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 52px;
  height: 52px;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: 900;
  color: var(--white);
  background: var(--accent);
  border: 5px solid var(--white);
  border-radius: 50%;
  box-shadow: var(--shadow);
}

/* Estado SELECCIONADO */
.card.selected {
  border-color: var(--accent);
  background: var(--white);
  box-shadow: 0 0 0 8px var(--tint), 0 10px 0 rgba(43, 45, 66, 0.18);
  transform: scale(1.05);
}
.card.selected .check { display: flex; }
.card.selected .label { color: var(--accent); }
.card.pop { animation: pop 0.45s ease; }

@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.14) rotate(-2deg); }
  100% { transform: scale(1.05); }
}

/* =====================================================================
   5. ICONOS  —  AQUÍ SE SUSTITUYEN LOS EMOJIS POR IMÁGENES DE GENIALLY
   ---------------------------------------------------------------------
   Cada tarjeta usa un contenedor ".icon".
   Orden de prioridad (en el script, campos de cada opción):
   1. "img": ruta a un PNG/SVG externo  ->  se muestra ".icon-img".
   2. "svg": dibujo SVG incluido en este archivo  ->  se muestra ".illus".
   3. "icon": emoji o texto provisional  ->  se muestra ".icon-emoji".
   Para cambiar el tamaño de todas las imágenes a la vez, edita ".icon" y ".icon-img".
   ===================================================================== */
.icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 110px;
  height: 110px;
}
.icon-emoji { font-size: 5.2rem; line-height: 1; }
.icon-img   { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Dibujos SVG: se adaptan al tamaño de ".icon" */
.illus { display: block; width: 100%; height: 100%; }

/* Tamaño de las ilustraciones de los días y del tiempo (cámbialo aquí) */
.grid-days .icon    { width: 132px; height: 132px; }
.grid-weather .icon { width: 150px; height: 150px; }
.grid-transport .icon { width: 150px; height: 150px; }

/* =====================================================================
   6. BOTONES DE NAVEGACIÓN
   ===================================================================== */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: 34px;
}

.btn {
  font-family: inherit;
  font-size: 2.2rem;
  font-weight: 800;
  padding: 18px 40px;
  min-height: 84px;
  color: var(--white);
  background: #3a86ff;
  border: 6px solid var(--white);
  border-radius: 999px;
  box-shadow: var(--shadow);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s ease;
}
.btn:hover { transform: translateY(-3px) scale(1.03); }
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: 6px solid var(--ink); outline-offset: 4px; }

.btn-next  { background: #2bb673; animation: nudge 1.4s ease-in-out infinite; }
.btn-back  { background: #9aa0b4; font-size: 1.7rem; padding: 14px 28px; min-height: 68px; }
.btn-again { background: #ff5d8f; }
.hidden    { visibility: hidden; pointer-events: none; }

@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(6px); }
}

/* =====================================================================
   7. PANTALLA FINAL
   ===================================================================== */
.say-list {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.say-card {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 18px 28px;
  background: var(--tint);
  border: 8px solid var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: slideIn 0.5s ease both;
}
.say-card:nth-child(2) { animation-delay: 0.12s; }
.say-card:nth-child(3) { animation-delay: 0.24s; }
.say-card:nth-child(4) { animation-delay: 0.36s; }

.say-card .icon { width: 100px; height: 100px; flex: none; }
.say-card .icon-emoji { font-size: 4.8rem; }
.say-card .sentence {
  font-size: clamp(1.9rem, 5vw, 3rem);
  font-weight: 800;
  line-height: 1.2;
}
.say-card .sentence .word {
  color: var(--accent);
  background: var(--white);
  padding: 0 14px;
  border-radius: 18px;
  white-space: nowrap;
}
/* En la pantalla final los días no necesitan insignia redonda grande */
.say-card .icon-emoji.badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 92px;
  height: 92px;
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--white);
  background: var(--accent);
  border-radius: 50%;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.final-nav { justify-content: center; flex-wrap: wrap; }

/* =====================================================================
   8. PANTALLAS PEQUEÑAS Y ACCESIBILIDAD
   ===================================================================== */
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { min-height: 150px; }
  .card .label { font-size: 1.5rem; }
  .icon { width: 80px; height: 80px; }
  .icon-emoji { font-size: 3.8rem; }
  .grid-days .icon    { width: 98px; height: 98px; }
  .grid-weather .icon { width: 104px; height: 104px; }
  .grid-transport .icon { width: 104px; height: 104px; }
  .say-card { flex-direction: column; text-align: center; gap: 10px; }
  .btn { font-size: 1.7rem; padding: 14px 26px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

<body>

  <header class="top">

  <main id="screen"></main>
</div>

<script>
/* =====================================================================
   0. ILUSTRACIONES SVG (provisionales, dibujadas dentro del archivo)
   ---------------------------------------------------------------------
   Todas comparten estilo: contorno oscuro de 5 px, formas redondeadas
   y colores suaves. El tiempo son personajes con ojos y cara; los días
   son objetos sencillos.
   CÓMO SUSTITUIRLAS DESPUÉS: en STEPS (más abajo) rellena "img" de la
   opción con la ruta del PNG/SVG, por ejemplo  img: "images/monday.png".
   Si "img" tiene valor, se usa en lugar de este dibujo.
   ===================================================================== */
var INK = "#2b2d42";

function svgWrap(inner) {
  return '<svg class="illus" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' +
    '<g stroke="' + INK + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' + inner + '</g></svg>';
}

/* --- Piezas de las caras (iguales en todos los personajes) --- */
function eyePair(x1, x2, y, r) {
  function eye(x) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" stroke-width="4"/>' +
      '<circle cx="' + x + '" cy="' + (y + 1) + '" r="' + (r * 0.52) + '" fill="' + INK + '" stroke="none"/>' +
      '<circle cx="' + (x + r * 0.22) + '" cy="' + (y - r * 0.2) + '" r="' + (r * 0.2) + '" fill="#fff" stroke="none"/>';
  }
  return eye(x1) + eye(x2);
}
function cheekPair(x1, x2, y) {
  return '<circle cx="' + x1 + '" cy="' + y + '" r="5.5" fill="#ff8fa3" opacity="0.75" stroke="none"/>' +
         '<circle cx="' + x2 + '" cy="' + y + '" r="5.5" fill="#ff8fa3" opacity="0.75" stroke="none"/>';
}
function mouthShape(kind, x, y) {
  if (kind === "open") return '<path d="M' + (x - 12) + ' ' + y + ' Q' + x + ' ' + (y + 22) + ' ' + (x + 12) + ' ' + y + ' Z" fill="#ff6b81" stroke-width="4"/>';
  if (kind === "sad")  return '<path d="M' + (x - 9) + ' ' + (y + 6) + ' Q' + x + ' ' + (y - 5) + ' ' + (x + 9) + ' ' + (y + 6) + '" fill="none"/>';
  if (kind === "oh")   return '<ellipse cx="' + x + '" cy="' + (y + 3) + '" rx="6" ry="8" fill="#7a2e45" stroke-width="4"/>';
  return '<path d="M' + (x - 10) + ' ' + y + ' Q' + x + ' ' + (y + 11) + ' ' + (x + 10) + ' ' + y + '" fill="none"/>';
}

/* --- Piezas del tiempo --- */
var CLOUD = '<path d="M32 84 C16 84 12 62 30 58 C30 38 58 30 68 46 C82 36 104 46 100 64 C114 66 112 84 94 84 Z"';
function dropShape(x, y) {
  return '<path transform="translate(' + x + ' ' + y + ')" d="M0 -9 C6 -1 8 3 8 6 A8 8 0 0 1 -8 6 C-8 3 -6 -1 0 -9 Z" fill="#4dabf7" stroke-width="4"/>';
}

function sunnyArt() {
  var rays = "";
  for (var a = 0; a < 360; a += 45) {
    rays += '<g transform="rotate(' + a + ' 60 60)"><path d="M60 6 L68 24 L52 24 Z" fill="#ffa62b" stroke-width="4"/></g>';
  }
  return svgWrap(rays + '<circle cx="60" cy="60" r="31" fill="#ffd84d"/>' +
    eyePair(49, 71, 55, 8) + cheekPair(39, 81, 68) + mouthShape("open", 60, 66));
}
function cloudyArt() {
  return svgWrap(CLOUD + ' fill="#d6e6f7"/>' +
    eyePair(47, 73, 58, 9) + cheekPair(36, 84, 69) + mouthShape("smile", 60, 70));
}
function rainyArt() {
  return svgWrap(dropShape(38, 92) + dropShape(62, 101) + dropShape(86, 92) +
    '<g transform="translate(0 -14)">' + CLOUD + ' fill="#a9cdee"/>' +
    eyePair(47, 73, 58, 9) + cheekPair(36, 84, 69) + mouthShape("sad", 60, 71) + '</g>');
}
function windyArt() {    // dibujo de reserva (se usa la imagen real "img")
  return svgWrap('<path d="M14 96 H70 C86 96 86 80 72 80" fill="none" stroke-width="6"/>' +
    '<path d="M24 108 H84 C98 108 98 94 88 94" fill="none" stroke-width="6"/>' +
    '<g transform="translate(6 -10)">' + CLOUD + ' fill="#e9eef5"/>' +
    eyePair(47, 73, 58, 9) + cheekPair(36, 84, 69) + mouthShape("smile", 60, 70) + '</g>');
}
function snowyArt() {
  var arms = "", tips = "", a;
  for (a = 0; a < 180; a += 60) {
    arms += '<g transform="rotate(' + a + ' 60 60)">' +
      '<line x1="60" y1="14" x2="60" y2="106" stroke-width="13"/>' +
      '<line x1="60" y1="14" x2="60" y2="106" stroke="#8ecbf5" stroke-width="6"/></g>';
  }
  for (a = 0; a < 360; a += 60) {
    tips += '<g transform="rotate(' + a + ' 60 60)"><circle cx="60" cy="14" r="7" fill="#fff" stroke-width="4"/></g>';
  }
  return svgWrap(arms + tips + '<circle cx="60" cy="60" r="27" fill="#eaf8ff"/>' +
    eyePair(50, 70, 56, 7.5) + cheekPair(41, 79, 67) + mouthShape("open", 60, 65));
}

/* --- Piezas de los días: mismo estilo que tus imágenes del tiempo
       (contorno grueso, sombreado suave y carita) --- */
function rr(x, y, w, h, r) {   // rectángulo redondeado como trazo
  return 'M' + (x + r) + ' ' + y + ' H' + (x + w - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (x + w) + ' ' + (y + r) +
    ' V' + (y + h - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (x + w - r) + ' ' + (y + h) +
    ' H' + (x + r) + ' A' + r + ' ' + r + ' 0 0 1 ' + x + ' ' + (y + h - r) +
    ' V' + (y + r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (x + r) + ' ' + y + ' Z';
}
function circ(cx, cy, r) {     // círculo como trazo
  return 'M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 1 0 ' + (cx + r) + ' ' + cy +
    ' A' + r + ' ' + r + ' 0 1 0 ' + (cx - r) + ' ' + cy + ' Z';
}
function pent(cx, cy, r) {     // pentágono oscuro del balón
  var pts = [];
  for (var k = 0; k < 5; k++) {
    var ang = (-90 + 72 * k) * Math.PI / 180;
    pts.push((cx + r * Math.cos(ang)).toFixed(1) + ',' + (cy + r * Math.sin(ang)).toFixed(1));
  }
  return '<polygon points="' + pts.join(' ') + '" fill="' + INK + '" stroke-width="3"/>';
}
/* Forma con sombreado suave a la izquierda y abajo, y contorno encima */
function shaded(id, d, light, dark) {
  return '<clipPath id="clip-' + id + '"><path d="' + d + '"/></clipPath>' +
    '<path d="' + d + '" fill="' + dark + '"/>' +
    '<g clip-path="url(#clip-' + id + ')"><path transform="translate(8 -6)" d="' + d + '" fill="' + light + '" stroke="none"/></g>' +
    '<path d="' + d + '" fill="none"/>';
}
/* Carita: ojos de raya, mejillas rosas y sonrisa pequeña */
function kawaiiFace(x1, x2, y) {
  var cx = (x1 + x2) / 2;
  return '<line x1="' + x1 + '" y1="' + (y - 4) + '" x2="' + x1 + '" y2="' + (y + 4) + '" stroke-width="4.5"/>' +
    '<line x1="' + x2 + '" y1="' + (y - 4) + '" x2="' + x2 + '" y2="' + (y + 4) + '" stroke-width="4.5"/>' +
    '<ellipse cx="' + (x1 - 6) + '" cy="' + (y + 8) + '" rx="7.5" ry="5" fill="#ff8fa3" opacity="0.9" stroke="none"/>' +
    '<ellipse cx="' + (x2 + 6) + '" cy="' + (y + 8) + '" rx="7.5" ry="5" fill="#ff8fa3" opacity="0.9" stroke="none"/>' +
    '<path d="M' + (cx - 5) + ' ' + (y + 8) + ' Q' + cx + ' ' + (y + 14) + ' ' + (cx + 5) + ' ' + (y + 8) + '" fill="none" stroke-width="4"/>';
}

function mondayArt() {   // mochila del cole
  return svgWrap(
    '<path d="M46 38 C46 16 74 16 74 38" fill="none"/>' +
    '<path d="' + rr(18, 58, 14, 34, 7) + '" fill="#5aa9f2"/>' +
    '<path d="' + rr(88, 58, 14, 34, 7) + '" fill="#5aa9f2"/>' +
    shaded("monday", rr(28, 32, 64, 76, 24), "#9fd0ff", "#6db4f5") +
    '<path d="' + rr(42, 80, 36, 20, 8) + '" fill="#ffe27a"/>' +
    kawaiiFace(48, 72, 52));
}
function tuesdayArt() {  // lápiz
  return svgWrap('<g transform="translate(60 60) rotate(-45) scale(0.88) translate(-60 -60)">' +
    '<path d="' + rr(40, 8, 40, 20, 9) + '" fill="#ff9bb0"/>' +
    '<path d="M40 26 H80 V36 H40 Z" fill="#e3e8ee"/>' +
    shaded("tuesday", "M40 36 H80 V84 H40 Z", "#ffe27a", "#f7c948") +
    '<path d="M40 84 L80 84 L60 112 Z" fill="#ffe9cf"/>' +
    '<path d="M52 101 L68 101 L60 112 Z" fill="' + INK + '"/>' +
    kawaiiFace(51, 69, 54) + '</g>');
}
function wednesdayArt() { // libro
  return svgWrap(
    '<path d="' + rr(34, 22, 62, 86, 6) + '" fill="#fff"/>' +
    shaded("wednesday", rr(24, 14, 66, 88, 10), "#ffa9bd", "#f27d98") +
    '<path d="M38 14 V102" fill="none"/>' +
    '<path d="' + rr(46, 24, 34, 11, 5) + '" fill="#fff"/>' +
    kawaiiFace(54, 76, 56));
}
function thursdayArt() { // paleta de pintura
  return svgWrap(
    shaded("thursday", "M60 16 C28 16 12 40 16 64 C20 88 44 100 58 96 C68 93 60 82 68 77 C76 72 98 84 106 64 C114 40 92 16 60 16 Z", "#ffe3bd", "#f7c692") +
    '<circle cx="36" cy="38" r="7" fill="#ff7a7a" stroke-width="3.5"/>' +
    '<circle cx="60" cy="30" r="7" fill="#ffd84d" stroke-width="3.5"/>' +
    '<circle cx="84" cy="38" r="7" fill="#6fdc8c" stroke-width="3.5"/>' +
    '<circle cx="94" cy="60" r="7" fill="#6db4f5" stroke-width="3.5"/>' +
    kawaiiFace(46, 70, 58));
}
function fridayArt() {   // trozo de pizza
  return svgWrap(
    shaded("friday", "M16 40 L104 40 L60 106 Z", "#ffe27a", "#f7c948") +
    '<path d="M12 42 Q60 12 108 42 Q108 54 100 50 Q60 30 20 50 Q12 54 12 42 Z" fill="#f0b565"/>' +
    '<circle cx="36" cy="54" r="6" fill="#ff7a7a" stroke-width="3.5"/>' +
    '<circle cx="84" cy="54" r="6" fill="#ff7a7a" stroke-width="3.5"/>' +
    '<circle cx="60" cy="92" r="6" fill="#ff7a7a" stroke-width="3.5"/>' +
    kawaiiFace(52, 68, 62));
}
function saturdayArt() { // balón de fútbol
  return svgWrap(
    shaded("saturday", circ(60, 60, 40), "#ffffff", "#d3d9e6") +
    pent(60, 30, 8) + pent(29, 66, 6.5) + pent(91, 66, 6.5) + pent(60, 92, 6) +
    kawaiiFace(51, 69, 56));
}
function sundayArt() {   // casa con corazón (día en familia)
  return svgWrap(
    '<path d="' + rr(76, 24, 14, 26, 3) + '" fill="#ff9bb0"/>' +
    shaded("sundaywall", rr(22, 58, 76, 48, 6), "#fff0dc", "#f7cf9d") +
    shaded("sundayroof", "M10 62 L60 16 L110 62 Z", "#9fd0ff", "#6db4f5") +
    '<path d="M60 54 C46 44 52 34 60 41 C68 34 74 44 60 54 Z" fill="#ff7a7a" stroke-width="4"/>' +
    kawaiiFace(46, 74, 74));
}

var ART = {
  Sunny: sunnyArt(), Cloudy: cloudyArt(), Rainy: rainyArt(), Windy: windyArt(), Snowy: snowyArt(),
  Monday: mondayArt(), Tuesday: tuesdayArt(), Wednesday: wednesdayArt(), Thursday: thursdayArt(),
  Friday: fridayArt(), Saturday: saturdayArt(), Sunday: sundayArt()
};

/* =====================================================================
   A. CONTENIDO DE LA ASAMBLEA  (aquí se cambian textos e imágenes)
   ---------------------------------------------------------------------
   CÓMO SUSTITUIR EMOJIS POR IMÁGENES DE GENIALLY:
   1. Exporta cada imagen desde Genially (PNG con fondo transparente).
   2. Súbelas al repositorio, por ejemplo a una carpeta "images".
   3. En cada opción, rellena el campo  img  con la ruta, por ejemplo:
          img: "images/happy.png"
      Si "img" está vacío (""), se muestra el emoji provisional.
   ===================================================================== */
var STEPS = [
  {
    key: "feeling",
    id: "feelings",
    title: "How do you feel today?",
    options: [
      { value: "Happy",   icon: "😊", img: "", color: "c-yellow" },  // img: "images/happy.png"
      { value: "Sad",     icon: "😢", img: "", color: "c-blue"   },  // img: "images/sad.png"
      { value: "Angry",   icon: "😠", img: "", color: "c-red"    },  // img: "images/angry.png"
      { value: "Tired",   icon: "😴", img: "", color: "c-purple" },  // img: "images/tired.png"
      { value: "Excited", icon: "🤩", img: "", color: "c-orange" },  // img: "images/excited.png"
      { value: "Okay",    icon: "🙂", img: "", color: "c-green"  }   // img: "images/okay.png"
    ]
  },
  {
    key: "day",
    id: "days",
    title: "What day is it?",
    /* Días: cada uno tiene un dibujo SVG provisional (campo "svg").
       Para usar tu imagen real, rellena "img" y el dibujo se ignora. */
    options: [
      { value: "Monday",    icon: "", svg: ART.Monday,    img: "", color: "c-red"    },  // img: "images/monday.png"
      { value: "Tuesday",   icon: "", svg: ART.Tuesday,   img: "", color: "c-orange" },  // img: "images/tuesday.png"
      { value: "Wednesday", icon: "", svg: ART.Wednesday, img: "", color: "c-yellow" },  // img: "images/wednesday.png"
      { value: "Thursday",  icon: "", svg: ART.Thursday,  img: "", color: "c-green"  },  // img: "images/thursday.png"
      { value: "Friday",    icon: "", svg: ART.Friday,    img: "", color: "c-teal"   },  // img: "images/friday.png"
      { value: "Saturday",  icon: "", svg: ART.Saturday,  img: "", color: "c-blue"   },  // img: "images/saturday.png"
      { value: "Sunday",    icon: "", svg: ART.Sunday,    img: "", color: "c-purple" }   // img: "images/sunday.png"
    ]
  },
  {
    key: "weather",
    id: "weather",
    title: "What's the weather like?",
    options: [
      /* Personajes del tiempo: dibujos SVG con ojos (campo "svg").
         Para usar tu imagen real, rellena "img" y el dibujo se ignora. */
      { value: "Sunny",  icon: "", svg: ART.Sunny,  img: IMG.Sunny, color: "c-yellow" },  // img: "images/sunny.png"
      { value: "Cloudy", icon: "", svg: ART.Cloudy, img: IMG.Cloudy, color: "c-blue"   },  // img: "images/cloudy.png"
      { value: "Rainy",  icon: "", svg: ART.Rainy,  img: IMG.Rainy, color: "c-teal"   },  // img: "images/rainy.png"
      { value: "Windy",  icon: "", svg: ART.Windy,  img: IMG.Windy,  color: "c-purple" },  // img: "images/windy.png"
      { value: "Snowy",  icon: "", svg: ART.Snowy,  img: IMG.Snowy, color: "c-pink"   }   // img: "images/snowy.png"
    ]
  },
  {
    key: "transport",
    id: "transport",
    title: "How did you come to school?",
    options: [
      { value: "Walking", icon: "🚶", img: IMG.Walking, color: "c-green"  },  // img: "images/walking.png"
      { value: "Bike",    icon: "🚲", img: IMG.Bike, color: "c-orange" },  // img: "images/bike.png"
      { value: "Bus",     icon: "🚌", img: IMG.Bus, color: "c-yellow" },  // img: "images/bus.png"
      { value: "Car",     icon: "🚗", img: IMG.Car, color: "c-red"    }   // img: "images/car.png"
    ]
  }
];

/* =====================================================================
   B. FRASES DE LA PANTALLA FINAL
   Devuelven [texto antes, palabra destacada, texto después].
   ===================================================================== */
function buildSentence(key, value) {
  if (key === "feeling") return ["I feel ", value, "."];
  if (key === "day")     return ["Today is ", value, "."];
  if (key === "weather") return ["The weather is ", value, "."];
  if (key === "transport") {
    if (value === "Walking") return ["I came to school ", "walking", "."];
    return ["I came to school by ", value.toLowerCase(), "."];
  }
  return ["", value, ""];
}

/* =====================================================================
   C. MEMORIA (localStorage con copia de seguridad en memoria)
   ===================================================================== */
var STORAGE_KEY = "englishAssemblyYear1_v1";
var memoryCopy = null;   // por si el navegador bloquea localStorage

var state = { answers: {}, step: 0 };   // step: 0..3 preguntas, 4 = pantalla final
var FINAL_STEP = STEPS.length;

function loadSaved() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignorar */ }
  return memoryCopy;
}

function saveState() {
  var data = { answers: state.answers, step: state.step };
  memoryCopy = JSON.parse(JSON.stringify(data));
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignorar */ }
}

function clearSaved() {
  memoryCopy = null;
  try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignorar */ }
}

function firstUnanswered() {
  for (var i = 0; i < STEPS.length; i++) {
    if (!state.answers[STEPS[i].key]) return i;
  }
  return FINAL_STEP;
}

/* =====================================================================
   D. UTILIDADES DE DIBUJO
   ===================================================================== */
function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* Crea el icono de una opción: imagen si existe "img", si no el emoji. */
function makeIcon(option, extraClass) {
  var wrap = el("span", "icon");
  wrap.setAttribute("aria-hidden", "true");
  if (option.img) {
    var img = document.createElement("img");
    img.className = "icon-img";
    img.src = option.img;
    img.alt = "";
    wrap.appendChild(img);
  } else if (option.svg) {
    wrap.innerHTML = option.svg;      // dibujo SVG propio (texto fijo de este archivo)
  } else {
    wrap.appendChild(el("span", "icon-emoji" + (extraClass ? " " + extraClass : ""), option.icon));
  }
  return wrap;
}

function findOption(step, value) {
  for (var i = 0; i < step.options.length; i++) {
    if (step.options[i].value === value) return step.options[i];
  }
  return null;
}

function setProgress() {
  var label = document.getElementById("progressLabel");
  var fill = document.getElementById("progressFill");
  if (state.step >= FINAL_STEP) {
    label.textContent = "🎉 Finished!";
    fill.style.width = "100%";
  } else {
    label.textContent = (state.step + 1) + " / " + STEPS.length;
    fill.style.width = (((state.step + 1) / STEPS.length) * 100) + "%";
  }
}

/* =====================================================================
   E. PANTALLAS
   ===================================================================== */
function goTo(step) {
  state.step = step;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  var step = STEPS[state.step];
  var screen = document.getElementById("screen");
  var section = el("section", "step step-" + step.id);

  section.appendChild(el("h1", "title", step.title));

  var grid = el("div", "grid grid-" + step.id);
  var nextBtn = el("button", "btn btn-next", "Next →");
  nextBtn.type = "button";

  var hasAnswer = !!state.answers[step.key];
  if (!hasAnswer) { nextBtn.classList.add("hidden"); nextBtn.disabled = true; }

  step.options.forEach(function (opt) {
    var card = el("button", "card " + opt.color);
    card.type = "button";
    var selected = state.answers[step.key] === opt.value;
    if (selected) card.classList.add("selected");
    card.setAttribute("aria-pressed", selected ? "true" : "false");

    card.appendChild(makeIcon(opt));
    card.appendChild(el("span", "label", opt.value));
    var check = el("span", "check", "✓");
    check.setAttribute("aria-hidden", "true");
    card.appendChild(check);

    card.addEventListener("click", function () {
      state.answers[step.key] = opt.value;
      saveState();

      var all = grid.querySelectorAll(".card");
      for (var i = 0; i < all.length; i++) {
        var on = all[i] === card;
        all[i].classList.toggle("selected", on);
        all[i].setAttribute("aria-pressed", on ? "true" : "false");
      }
      card.classList.remove("pop");
      void card.offsetWidth;          // reinicia la animación
      card.classList.add("pop");

      nextBtn.classList.remove("hidden");
      nextBtn.disabled = false;
    });

    grid.appendChild(card);
  });
  section.appendChild(grid);

  var nav = el("div", "nav");
  var backBtn = el("button", "btn btn-back", "← Back");
  backBtn.type = "button";
  if (state.step === 0) backBtn.classList.add("hidden");
  backBtn.addEventListener("click", function () { goTo(state.step - 1); });

  nextBtn.addEventListener("click", function () {
    if (!state.answers[step.key]) return;       // no se avanza sin elegir
    goTo(state.step + 1);
  });

  nav.appendChild(backBtn);
  nav.appendChild(nextBtn);
  section.appendChild(nav);

  screen.innerHTML = "";
  screen.appendChild(section);
}

function renderFinal() {
  var screen = document.getElementById("screen");
  var section = el("section", "step step-final");

  section.appendChild(el("h1", "title", "Let's say it all! 🗣️"));

  var list = el("div", "say-list");
  STEPS.forEach(function (step) {
    var value = state.answers[step.key];
    var opt = findOption(step, value);
    var parts = buildSentence(step.key, value);

    var card = el("div", "say-card " + (opt ? opt.color : "c-blue"));
    if (opt) card.appendChild(makeIcon(opt, step.key === "day" ? "badge" : ""));

    var sentence = el("div", "sentence");
    sentence.appendChild(document.createTextNode(parts[0]));
    sentence.appendChild(el("span", "word", parts[1]));
    sentence.appendChild(document.createTextNode(parts[2]));
    card.appendChild(sentence);

    list.appendChild(card);
  });
  section.appendChild(list);

  var nav = el("div", "nav final-nav");
  var backBtn = el("button", "btn btn-back", "← Back");
  backBtn.type = "button";
  backBtn.addEventListener("click", function () { goTo(STEPS.length - 1); });

  var againBtn = el("button", "btn btn-again", "🔄 Start again");
  againBtn.type = "button";
  againBtn.addEventListener("click", function () {
    clearSaved();
    state = { answers: {}, step: 0 };
    render();
    window.scrollTo(0, 0);
  });

  nav.appendChild(backBtn);
  nav.appendChild(againBtn);
  section.appendChild(nav);

  screen.innerHTML = "";
  screen.appendChild(section);
}

function render() {
  setProgress();
  if (state.step >= FINAL_STEP) renderFinal();
  else renderQuestion();
}

/* =====================================================================
   F. ARRANQUE
   ===================================================================== */
function init() {
  var saved = loadSaved();
  state = { answers: {}, step: 0 };

  if (saved && saved.answers && typeof saved.answers === "object") {
    STEPS.forEach(function (step) {
      var v = saved.answers[step.key];
      if (findOption(step, v)) state.answers[step.key] = v;   // solo valores válidos
    });
  }

  var step = (saved && typeof saved.step === "number") ? Math.floor(saved.step) : 0;
  if (!(step >= 0)) step = 0;
  if (step > FINAL_STEP) step = FINAL_STEP;
  var limit = firstUnanswered();           // no se puede saltar una pregunta sin responder
  if (step > limit) step = limit;

  state.step = step;
  render();
}

init();
</script>
